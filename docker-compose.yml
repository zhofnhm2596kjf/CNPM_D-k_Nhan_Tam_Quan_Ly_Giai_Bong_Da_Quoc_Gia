services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vdqg
      POSTGRES_PASSWORD: vdqg
      POSTGRES_DB: vdqg
    volumes:
      - vdqg_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vdqg -d vdqg"]
      interval: 5s
      timeout: 5s
      retries: 12
  web:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://vdqg:vdqg@db:5432/vdqg
    depends_on:
      db:
        condition: service_healthy
volumes:
  vdqg_pg:
